	sparkfun/SparkFun ISL29125 Breakout@^1.0.1
	adafruit/Adafruit TCS34725@^1.4.4
	adafruit/Adafruit ICM20X@^2.0.7
	sparkfun/SparkFun 9DoF IMU Breakout - ICM 20948 - Arduino Library@^1.3.2
